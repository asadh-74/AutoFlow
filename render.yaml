services:
  - type: web
    name: autoflow-java-api
    runtime: docker
    plan: free
    dockerfilePath: ./java-backend/Dockerfile
    dockerContext: ./java-backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: autoflow-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: autoflow-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: autoflow-db, property: database }
      - key: DB_USER
        fromDatabase: { name: autoflow-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: autoflow-db, property: password }
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false

  - type: web
    name: autoflow-python-service
    runtime: docker
    plan: free
    dockerfilePath: ./python-automation/Dockerfile
    dockerContext: ./python-automation
    healthCheckPath: /health

  - type: web
    name: autoflow-frontend
    runtime: static
    buildCommand: echo "Static frontend ready"
    staticPublishPath: ./frontend

databases:
  - name: autoflow-db
    plan: free
    databaseName: autoflow
    user: autoflow_user
