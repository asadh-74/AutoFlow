server.port=${PORT:8080}
spring.application.name=autoflow-api
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
autoflow.n8n.webhook-url=${N8N_WEBHOOK_URL:}
autoflow.n8n.lead-webhook-url=${N8N_LEAD_WEBHOOK_URL:}
autoflow.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}
management.endpoints.web.exposure.include=health,info
