server.port=${PORT:8080}
spring.application.name=autoflow-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/autoflow}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
autoflow.n8n.webhook-url=${N8N_WEBHOOK_URL:}
autoflow.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}
autoflow.python-service-url=${PYTHON_SERVICE_URL:http://localhost:8001}
management.endpoints.web.exposure.include=health,info
